[package]
name = "clipboard-preview"
version = "1.3.2"
description = "A fast, minimal clipboard preview and history utility for Windows, macOS, and Linux."
authors = ["SirPaul-code"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/SirPaul-code/ClipboardPreview"

[lib]
name = "clipboard_preview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-updater = "2.10.1"
arboard = "3.6"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
hex = "0.4"
image = { version = "0.24", default-features = false, features = ["png"] }
log = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
rdev = { version = "0.5.3", features = ["unstable_grab"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
