name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Resolve release version
    if: "${{ github.ref_type == 'tag' || startsWith(github.event.head_commit.message, 'release: v') }}"
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Resolve version tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
            echo "Release tag mismatch: expected ${TAG}, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build-release:
    name: Release ${{ matrix.name }}
    needs: prepare-release
    strategy:
      fail-fast: false
      # tauri-action merges each platform into one latest.json asset. Keep these
      # uploads serialized so concurrent jobs cannot overwrite each other's entry.
      max-parallel: 1
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            bundles: msi,nsis
          - name: macOS Apple Silicon
            os: macos-15
            bundles: app,dmg
          - name: macOS Intel
            os: macos-15-intel
            bundles: app,dmg
          - name: Linux x64
            os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    env:
      CLIPBOARD_PREVIEW_OFFICIAL_BUILD: '1'
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install exactly committed frontend dependencies
        run: npm ci

      - name: Validate version, tag, startup, and signing invariants
        run: npm run check:version

      - name: Verify locked Rust dependency graph
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps

      - name: Build and upload signed updater bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseName: Clipboard Preview ${{ needs.prepare-release.outputs.tag }}
          releaseBody: |
            Clipboard Preview official community release.

            Automatic updater artifacts are cryptographically signed by the Clipboard Preview updater key. Windows binaries are not Authenticode-signed and macOS community builds use ad-hoc signing unless platform signing credentials are configured separately.

            macOS manual download guide:
            - Apple Silicon (M1/M2/M3/M4): download the `darwin-aarch64.dmg` file.
            - Intel Mac: download the `darwin-x64.dmg` file.
            - The `.app.tar.gz` and `.sig` files are automatic-updater assets; normal users should use the `.dmg`.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          retryAttempts: 2
          args: --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}
          releaseAssetNamePattern: ClipboardPreview-[version]-[platform]-[arch][setup][ext]

  publish-release:
    name: Verify and publish complete release
    needs:
      - prepare-release
      - build-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download draft release metadata and updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-check
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > release-check/releases.json
          node <<'NODE'
          const fs = require('fs');
          const tag = process.env.RELEASE_TAG;
          const releases = JSON.parse(fs.readFileSync('release-check/releases.json', 'utf8'));
          const release = releases.find((entry) => entry.tag_name === tag && entry.draft === true);
          if (!release) {
            console.error(`Draft release ${tag} was not found`);
            process.exit(1);
          }
          fs.writeFileSync('release-check/release.json', JSON.stringify(release));
          NODE
          ASSET_ID="$(node -p "JSON.parse(require('fs').readFileSync('release-check/release.json','utf8')).assets.find(a => a.name === 'latest.json')?.id ?? ''")"
          if [ -z "$ASSET_ID" ]; then
            echo "latest.json is missing from the draft release" >&2
            exit 1
          fi
          gh api \
            -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            > release-check/latest.json

      - name: Verify complete signed updater release
        run: node scripts/verify-updater-release.mjs release-check/latest.json release-check/release.json

      - name: Publish only after every platform and updater target succeeded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID="$(node -p "JSON.parse(require('fs').readFileSync('release-check/release.json','utf8')).id")"
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -f make_latest=true \
            > release-check/published.json
          node -e "const r=require('./release-check/published.json'); if(r.draft || r.tag_name !== 'v' + require('./package.json').version) process.exit(1)"
