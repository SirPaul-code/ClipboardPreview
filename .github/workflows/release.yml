name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Resolve release version
    if: "${{ github.ref_type == 'tag' || startsWith(github.event.head_commit.message, 'release: v') }}"
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Resolve version tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
            echo "Release tag mismatch: expected ${TAG}, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build-release:
    name: Release ${{ matrix.name }}
    needs: prepare-release
    strategy:
      fail-fast: false
      # tauri-action merges each platform into one latest.json asset. Keep these
      # uploads serialized so concurrent jobs cannot overwrite each other's entry.
      # Put Apple Silicon first so production signing/notarization credentials fail
      # fast before spending time building the remaining release matrix.
      max-parallel: 1
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            bundles: app,dmg
          - name: macOS Intel
            os: macos-15-intel
            bundles: app,dmg
          - name: Windows x64
            os: windows-latest
            bundles: msi,nsis
          - name: Linux x64
            os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    env:
      CLIPBOARD_PREVIEW_OFFICIAL_BUILD: '1'
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Tauri uses these for Apple notarization on macOS. They are harmlessly empty
      # on the Windows/Linux matrix entries.
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install exactly committed frontend dependencies
        run: npm ci

      - name: Validate version, tag, startup, and signing invariants
        run: npm run check:version

      - name: Verify locked Rust dependency graph
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps

      - name: Prepare Developer ID signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          for required in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY APPLE_TEAM_ID; do
            if [ -z "${!required:-}" ]; then
              echo "Missing required macOS production signing secret: ${required}" >&2
              exit 1
            fi
          done

          KEYCHAIN_PATH="$RUNNER_TEMP/clipboard-preview-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"

          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$CERT_PATH"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$API_KEY_PATH"
          chmod 600 "$CERT_PATH" "$API_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          CERT_ID="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -n 1)"
          if [ -z "$CERT_ID" ]; then
            echo "Imported certificate does not contain a valid Developer ID Application identity" >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" >&2 || true
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
          echo "CLIPBOARD_PREVIEW_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "Developer ID signing identity imported successfully."

      - name: Build and upload signed updater bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ env.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
        with:
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseName: Clipboard Preview ${{ needs.prepare-release.outputs.tag }}
          releaseBody: |
            Clipboard Preview official community release.

            macOS builds are signed with Apple Developer ID, use the hardened runtime, and are submitted to Apple's notarization service before release. Automatic updater artifacts are also cryptographically signed by the Clipboard Preview updater key.

            Windows binaries are not Authenticode-signed yet.

            macOS manual download guide:
            - Apple Silicon (M1/M2/M3/M4): download the `darwin-aarch64.dmg` file.
            - Intel Mac: download the `darwin-x64.dmg` file.
            - The `.app.tar.gz` and `.sig` files are automatic-updater assets; normal users should use the `.dmg`.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          retryAttempts: 2
          args: --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}
          releaseAssetNamePattern: ClipboardPreview-[version]-[platform]-[arch][setup][ext]

      - name: Verify Developer ID signature and notarization ticket
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find src-tauri/target -type d -path '*/release/bundle/macos/Clipboard Preview.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "Built macOS app bundle was not found" >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          CODESIGN_INFO="$RUNNER_TEMP/clipboard-preview-codesign.txt"
          codesign -dvvv "$APP_PATH" 2> "$CODESIGN_INFO"
          grep -q 'Authority=Developer ID Application:' "$CODESIGN_INFO"
          grep -q "TeamIdentifier=${APPLE_TEAM_ID}" "$CODESIGN_INFO"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

          echo "macOS Developer ID signature, Gatekeeper assessment, and stapled notarization ticket are valid."

      - name: Remove temporary signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${CLIPBOARD_PREVIEW_KEYCHAIN:-}" ]; then
            security delete-keychain "$CLIPBOARD_PREVIEW_KEYCHAIN" || true
          fi

  publish-release:
    name: Verify and publish complete release
    needs:
      - prepare-release
      - build-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download draft release metadata and updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-check
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > release-check/releases.json
          node <<'NODE'
          const fs = require('fs');
          const tag = process.env.RELEASE_TAG;
          const releases = JSON.parse(fs.readFileSync('release-check/releases.json', 'utf8'));
          const release = releases.find((entry) => entry.tag_name === tag && entry.draft === true);
          if (!release) {
            console.error(`Draft release ${tag} was not found`);
            process.exit(1);
          }
          fs.writeFileSync('release-check/release.json', JSON.stringify(release));
          NODE
          ASSET_ID="$(node -p "JSON.parse(require('fs').readFileSync('release-check/release.json','utf8')).assets.find(a => a.name === 'latest.json')?.id ?? ''")"
          if [ -z "$ASSET_ID" ]; then
            echo "latest.json is missing from the draft release" >&2
            exit 1
          fi
          gh api \
            -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            > release-check/latest.json

      - name: Verify complete signed updater release
        run: node scripts/verify-updater-release.mjs release-check/latest.json release-check/release.json

      - name: Publish only after every platform and updater target succeeded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID="$(node -p "JSON.parse(require('fs').readFileSync('release-check/release.json','utf8')).id")"
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -f make_latest=true \
            > release-check/published.json
          node -e "const r=require('./release-check/published.json'); if(r.draft || r.tag_name !== 'v' + require('./package.json').version) process.exit(1)"

      - name: Verify public latest updater endpoint
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          export EXPECTED_VERSION="${RELEASE_TAG#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location "$URL" -o release-check/public-latest.json; then
              if node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('release-check/public-latest.json', 'utf8'));
          const expected = process.env.EXPECTED_VERSION;
          const platforms = ['windows-x86_64', 'darwin-aarch64', 'darwin-x86_64', 'linux-x86_64'];
          if (manifest.version !== expected) process.exit(1);
          for (const platform of platforms) {
            const entry = manifest.platforms?.[platform];
            if (!entry?.url || !entry?.signature) process.exit(1);
          }
          NODE
              then
                echo "Public latest updater endpoint serves ${EXPECTED_VERSION}."
                exit 0
              fi
            fi
            echo "Public latest updater endpoint not ready yet (attempt ${attempt}/12)."
            sleep 5
          done
          echo "Public latest updater endpoint did not serve ${EXPECTED_VERSION}." >&2
          exit 1
