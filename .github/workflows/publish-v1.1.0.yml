name: Publish v1.1.0

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-v1.1.0
  cancel-in-progress: false

env:
  RELEASE_TAG: v1.1.0
  RELEASE_SHA: 33d86bd04f4fc8ea3199635dd8112c864cff6959

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release and tag at validated merge commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "Clipboard Preview v1.1.0" \
              --notes "Clipboard Preview v1.1.0 introduces the unified Tab clipboard switcher, image history and delayed image previews, bounded lightweight history, built-in crash diagnostics, a minimalist UI refresh, and the confirmed startup-order fix. Community artifacts are unsigned unless signing credentials are configured."
          fi

  build-release:
    needs: prepare-release
    name: v1.1.0 ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS Apple Silicon
            os: macos-15
          - name: macOS Intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Validate version and startup invariants
        shell: bash
        env:
          GITHUB_REF_TYPE: tag
          GITHUB_REF_NAME: v1.1.0
        run: npm run check:version
      - name: Verify locked Rust dependency graph
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps
      - name: Build and upload release bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.1.0
          releaseName: Clipboard Preview v1.1.0
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          releaseAssetNamePattern: ClipboardPreview-[version]-[platform]-[arch][setup][ext]
