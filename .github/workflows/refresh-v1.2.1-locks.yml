name: Refresh v1.2.1 lock metadata

on:
  push:
    branches: [release/v1.2.1]
    paths:
      - '.github/workflows/refresh-v1.2.1-locks.yml'

permissions:
  contents: write

jobs:
  refresh-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.2.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize lockfile package versions only
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          lock.version = '1.2.1';
          lock.packages[''].version = '1.2.1';
          fs.writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          NODE
          python3 <<'PY'
          from pathlib import Path
          path = Path('src-tauri/Cargo.lock')
          text = path.read_text()
          old = 'name = "clipboard-preview"\nversion = "1.2.0"'
          new = 'name = "clipboard-preview"\nversion = "1.2.1"'
          if old not in text:
              raise SystemExit('clipboard-preview 1.2.0 root package entry not found in Cargo.lock')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit lockfile metadata
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json src-tauri/Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync v1.2.1 lockfiles"
          git push origin HEAD:release/v1.2.1
