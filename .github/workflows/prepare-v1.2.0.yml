name: Prepare v1.2.0

on:
  push:
    branches: [release/v1.2.0]
    paths:
      - '.github/workflows/prepare-v1.2.0.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.2.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize v1.2.0 manifests and root lock entries
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = '1.2.0';

          const pkgPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          const lockPath = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          lock.version = version;
          if (lock.packages?.['']) lock.packages[''].version = version;
          fs.writeFileSync(lockPath, JSON.stringify(lock, null, 2) + '\n');

          const cargoPath = 'src-tauri/Cargo.toml';
          let cargo = fs.readFileSync(cargoPath, 'utf8');
          cargo = cargo.replace(/^(version\s*=\s*")[^"]+("\s*)$/m, `$1${version}$2`);
          fs.writeFileSync(cargoPath, cargo);

          const cargoLockPath = 'src-tauri/Cargo.lock';
          let cargoLock = fs.readFileSync(cargoLockPath, 'utf8');
          cargoLock = cargoLock.replace(
            /(\[\[package\]\]\nname = "clipboard-preview"\nversion = ")[^"]+("\n)/,
            `$1${version}$2`
          );
          fs.writeFileSync(cargoLockPath, cargoLock);

          const tauriPath = 'src-tauri/tauri.conf.json';
          const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
          tauri.version = version;
          fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + '\n');

          const settingsPath = 'src/apps/SettingsApp.tsx';
          let settings = fs.readFileSync(settingsPath, 'utf8');
          settings = settings.replaceAll("status?.version ?? '1.1.0'", "status?.version ?? '1.2.0'");
          fs.writeFileSync(settingsPath, settings);
          NODE
      - name: Verify synchronized version without changing dependencies
        run: npm run check:version
      - name: Commit version files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json src/apps/SettingsApp.tsx
          git commit -m "chore: bump version to 1.2.0"
          git push origin HEAD:release/v1.2.0
