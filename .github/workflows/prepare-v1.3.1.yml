name: Prepare v1.3.1 version locks

on:
  push:
    branches:
      - fix/macos-v1.3.1

permissions:
  contents: write

jobs:
  bump:
    if: "${{ github.event.head_commit.message == 'ci: prepare v1.3.1 version locks' }}"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/macos-v1.3.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Bump synchronized app version and lockfiles
        shell: bash
        run: |
          set -euo pipefail
          npm version 1.3.1 --no-git-tag-version
          node <<'NODE'
          const fs = require('fs');
          const path = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.version = '1.3.1';
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/Cargo.toml')
          text = path.read_text()
          old = 'version = "1.3.0"'
          if old not in text:
              raise SystemExit('Cargo.toml package version 1.3.0 not found')
          path.write_text(text.replace(old, 'version = "1.3.1"', 1))
          PY
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null
          npm run check:version
          cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps > /dev/null
          git diff --check
          git diff --exit-code -- package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json || true

      - name: Commit v1.3.1 version files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SirPaul-code"
          git config user.email "79102860+SirPaul-code@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          if git diff --cached --quiet; then
            echo "No version changes to commit"
            exit 0
          fi
          git commit -m "chore: bump version to 1.3.1"
          git push origin HEAD:fix/macos-v1.3.1
