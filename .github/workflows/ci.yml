name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Fresh clone frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exactly committed dependencies
        run: npm ci
      - name: Validate source-build invariants, lint, and frontend build
        run: npm run check

  native:
    name: Fresh clone ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            bundles: msi,nsis
            artifact: windows-x64
          - name: macOS Apple Silicon
            os: macos-15
            bundles: app,dmg
            artifact: macos-aarch64
          - name: macOS Intel
            os: macos-15-intel
            bundles: app,dmg
            artifact: macos-x64
          - name: Linux x64
            os: ubuntu-22.04
            bundles: appimage,deb
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install exactly committed frontend dependencies
        run: npm ci
      - name: Validate source-build invariants
        run: npm run check:version
      - name: Rust tests from committed lockfile
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Strict Rust lint from committed lockfile
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build distributable bundle without release secrets
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - name: Upload smoke-test bundles
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-preview-v1.3.0-${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14
